name: Build AstroCare APK
 
on:
  push:
    branches: [main]
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
 
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
 
      - name: Generate the Android project
        run: flutter create --platforms=android --org org.falconhealth --project-name astrocare .
 
      - name: Allow internet access (sign-in and online backup)
        run: >-
          grep -q android.permission.INTERNET android/app/src/main/AndroidManifest.xml ||
          sed -i
          's|<application|<uses-permission android:name="android.permission.INTERNET"/><application|'
          android/app/src/main/AndroidManifest.xml
 
      - name: Prepare the assets folder and download the brand font
        run: mkdir -p assets && bash tool/get_fonts.sh
        continue-on-error: true
 
      - name: Remove the default template test
        run: rm -f test/widget_test.dart
      - name: Get dependencies
        run: flutter pub get
 
      - name: Run unit tests
        run: flutter test
        continue-on-error: true
 
      - name: Build release APK
        run: flutter build apk --release
 
      - uses: actions/upload-artifact@v4
        with:
          name: astrocare-apk
          path: build/app/outputs/flutter-apk/app-release.apk
